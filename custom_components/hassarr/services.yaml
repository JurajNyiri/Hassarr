add_radarr_movie:
  description: "Add a movie to Radarr"
  fields:
    title:
      description: "Title of the movie"
      example: "Gladiator"
    instance:
      description: "Optional instance selector (entry_id or service suffix). Required if multiple Radarr instances exist."
      example: "8f3c22a1"

add_sonarr_tv_show:
  description: "Add a TV show to Sonarr"
  fields:
    title:
      description: "Title of the TV show"
      example: "Breaking Bad"
    instance:
      description: "Optional instance selector (entry_id or service suffix). Required if multiple Sonarr instances exist."
      example: "8f3c22a1"

add_overseerr_movie:
  description: "Add a movie to Overseerr"
  fields:
    title:
      description: "Title of the movie"
      example: "Gladiator"
    instance:
      description: "Optional instance selector (entry_id or service suffix). Required if multiple Overseerr instances exist."
      example: "8f3c22a1"

add_overseerr_tv_show:
  description: "Add a TV show to Overseerr"
  fields:
    title:
      description: "Title of the TV show"
      example: "Breaking Bad"
    instance:
      description: "Optional instance selector (entry_id or service suffix). Required if multiple Overseerr instances exist."
      example: "8f3c22a1"
